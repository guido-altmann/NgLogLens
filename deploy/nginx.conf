# nginx-Konfiguration für NgLogLens: statische Blazor-WebAssembly-App ohne Backend.
# Im Docker-Image liegt sie als /etc/nginx/conf.d/default.conf; auf einem eigenen
# Server als eigener server-Block (root anpassen).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # dotnet publish legt zu jeder Datei eine .gz-Fassung ab; nginx liefert sie aus,
    # statt bei jedem Abruf neu zu komprimieren. (Die .br-Fassungen bräuchten das
    # Brotli-Modul, das im offiziellen nginx-Image fehlt.)
    gzip_static on;
    gzip_vary on;

    # .wasm muss als application/wasm kommen, sonst lehnt der Browser das
    # Streaming-Kompilieren ab. Die mime.types aktueller nginx-Versionen enthalten
    # den Eintrag. Kein eigener types-Block hier: der ersetzte die ganze Tabelle.

    # Dateien mit Fingerabdruck im Namen (z. B. LogLens.Core.9zqouo62zp.wasm)
    # ändern sich nie: ein Jahr cachen.
    location ~* "\.[a-z0-9]{10}\.(wasm|js|dat)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Framework-Dateien ohne Fingerabdruck (blazor.webassembly.js, dotnet.js):
    # immer nachfragen, sonst passt nach einem Update die Runtime nicht zu den DLLs.
    # Fehlt eine Datei, bleibt es bei 404 statt index.html.
    location /_framework/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Alles andere, inklusive index.html: immer nachfragen (ETag), und jede
    # unbekannte Route an die App geben – sie routet selbst (/overview, /attacks …).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
