# Sicherheits-Header für NgLogLens. Wird in jeden location-Block eingebunden, weil
# nginx add_header aus dem server-Block nicht erbt, sobald eine location eigene setzt.
#
# Content-Security-Policy:
#   connect-src 'self'       Der Browser lässt keine Verbindung zu fremden Hosts zu.
#                            Damit ist auch technisch ausgeschlossen, dass Loginhalte
#                            die Seite verlassen (CLAUDE.md, Datenschutz).
#   'wasm-unsafe-eval'       Blazor WebAssembly muss die .NET-Runtime instanziieren.
#   'unsafe-eval'            Blazor-ApexCharts wertet Achsen-Formatter per eval() aus.
#   style-src 'unsafe-inline' MudBlazor und ApexCharts setzen Inline-Styles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
